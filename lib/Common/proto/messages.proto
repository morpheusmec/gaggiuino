syntax = "proto3";

enum OperationModeDto {
  BREW_AUTO = 0;
  BREW_MANUAL = 1;
  FLUSH = 2;
  DESCALE = 3;
  STEAM = 4;
  FLUSH_AUTO = 5;
};

message UpdateSystemStateComandDto {
  OperationModeDto operationMode = 1;
  bool tarePending = 2;
}

message RequestDataDto {
  uint32 type = 1;
}

message SystemStateDto {
  bool startupInitFinished = 1;
  bool tofReady = 2;
  bool isSteamForgottenON = 3;
  bool scalesPresent = 4;
  OperationModeDto operationMode = 5;
  uint32 timeAlive = 6;
  bool tarePending = 8;
}

message SensorStateSnapshotDto {
  bool brewActive = 1;
  bool steamActive = 2;
  bool flushActive = 3;
  bool hotWaterActive = 4;
  float temperature = 5;
  float waterTemperature = 6;
  float targetTemperature = 7;
  float pressure = 8;
  float pumpFlow = 9;
  float weightFlow = 10;
  float weight = 11;
  uint32 waterLevel = 12; 
}

message ShotSnapshotDto {
  uint32 timeInShot = 1;
  float pressure = 2;
  float pumpFlow = 3;
  float weightFlow = 4;
  float temperature = 5;
  float shotWeight = 6;
  float waterPumped = 7;
  float targetTemperature = 8;
  float targetPumpFlow = 9;
  float targetPressure = 10;
}

message MeasurementDto {
  float value = 1;
  uint32 time = 2;
}

message NotificationDto {
  enum NotificationTypeDto {
    INFO = 0;
    SUCCESS = 1;
    WARN = 2;
    ERROR = 3;
  }
  NotificationTypeDto type = 1;
  string message = 2;
}

enum DescalingStateDto {
  IDLE = 0;
  PHASE1 = 1;
  PHASE2 = 2;
  PHASE3 = 3;
  PHASE4 = 4;
  PHASE5 = 5;
  FINISHED = 6;
}

message DescalingProgressDto {
  DescalingStateDto state = 1;
  uint32 time = 2;
  uint32 progess = 3;
}
