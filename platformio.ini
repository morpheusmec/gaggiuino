; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = extra_defines.ini
default_envs =
    CYD

[extra]
build_flags =
	;placeholder values, create a untracked extra_defines.ini file
	;in the project root directory(same level as platformio.ini)
	;so you can keep your custom setup defined by default on every pull
	; -DDREAM_STEAM_DISABLED
	; -DSINGLE_HX711_BOARD

[env]
check_tool = clangtidy, cppcheck
check_skip_packages = yes
check_flags =
	clangtidy: --checks=-*,cert-*,clang-analyzer-* --fix
	cppcheck: --enable=all --std=c++11 --suppress=*:*/.pio/* --suppress=*:*/lib/* --suppress=missingIncludeSystem --suppress=unmatchedSuppression --suppress=missingInclude --suppress=unusedFunction
platform_packages = tool-cppcheck@1.260.0

[env:Brevillino]
framework = arduino
platform = ststm32@15.6.0
board = blackpill_f411ce
extra_scripts =
	pre:scripts/auto-version.py
	pre:scripts/custom-src-dir.py
custom_src_dir = src
upload_protocol = stlink
debug_tool = stlink
monitor_filters = default, log2file
monitor_speed = 115200
lib_compat_mode = strict
lib_deps =
	robtillaart/ADS1X15@0.3.7
	khoih-prog/FlashStorage_STM32@1.2.0
	powerbroker2/SerialTransfer@^3.1.3
	https://github.com/morpheusmec/SimpleKalmanFilter.git
	https://github.com/banoz/HX711.git#feature/timer
	https://github.com/morpheusmec/PSM.Library.git#feature/timer
	https://github.com/morpheusmec/Adafruit_MAX31856.git
	https://github.com/RobTillaart/PCF8575.git#0.3.0
	https://github.com/Zer0-bit/Adafruit_VL53L0X.git#0aff489dd34821318faf297a09956edf60c31151
	https://github.com/JChristensen/movingAvg.git#63dfeb53e0ea8255b47f582efdd37eb029bb043d
	nanopb/Nanopb@^0.4.7
	nanopb/Nanopb_Cpp@^0.1.10
build_flags =
	-DSINGLE_HX711_BOARD
	-DTOF_VL53L0X	
	-DPUMP_PIN_ACTIVE_LOW
	-DHEATER_PIN_ACTIVE_LOW
	-DZC_EXT_PULLUP_ONLY
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-DUSBCON
	-DLOG_LEVEL=4
	; -DDEBUG_ENABLED
	;if using a bigger boilr machine like Silvia set -DDREAM_STEAM_DISABLED in the extra_defines.ini
	${extra.build_flags}
	-DPIO_FRAMEWORK_ARDUINO_STANDARD_LIB
	-DENABLE_HWSERIAL2
	-DPB_WITHOUT_64BIT
	-DPIN_SERIAL2_RX=PA3
	-DPIN_SERIAL2_TX=PA2
	-DPIN_SERIAL1_RX=PA10
	-DPIN_SERIAL1_TX=PA9
	-DSERIAL_TX_BUFFER_SIZE=256
	-DSERIAL_RX_BUFFER_SIZE=256
	-DBEAUTIFY_GRAPH
	-O3
	-mfloat-abi=hard
	-mfpu=fpv4-sp-d16
build_unflags =
	-Os
build_src_flags =
	-Wdouble-promotion -Wall
check_src_filters =
	src
custom_nanopb_protos =
  +<lib/Common/proto/*.proto>

[env:CYD]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = BOARD_VIEWE_UEDX80480050E_WB_A
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
custom_src_dir = webserver
build_src_filter = +<*> -<web-interface>

build_flags =
	-std=gnu++17
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DLV_CONF_INCLUDE_SIMPLE
	-Iwebserver/include
	-DRX1=18
	-DTX1=17
	-DLOG_LEVEL=4	
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-DLV_COLOR_16_SWAP=0
	-DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_VIEWE_UEDX80480050E_WB_A
	-DASYNCWEBSERVER_REGEX
check_src_filters =
	webserver/src

lib_deps =
	https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
	https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
	https://github.com/lvgl/lvgl.git#v8.4.0
	https://github.com/ESP32Async/AsyncTCP.git#v3.4.10
	https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.9.4
	; https://github.com/kstam/esp-arduino-ble-scales.git#main
	nanopb/Nanopb@^0.4.7
	nanopb/Nanopb_Cpp@^0.1.10
	ArduinoJSON@^6.21.2
	powerbroker2/SerialTransfer@^3.1.3
	Wire

custom_nanopb_protos =
  +<lib/Common/proto/*.proto>
  +<webserver/src/persistence/proto/*.proto>
  
extra_scripts =
	pre:scripts/custom-src-dir.py
	webserver/replace_fs.py

build_unflags =
	-std=gnu++11
